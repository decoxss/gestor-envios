
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1>Gestor de Envíos</h1>
            <div class="menu">
                <a href="login.html">Iniciar sesión</a>
                <a href="index.html">Inicio</a>
            </div>
        </nav>
    </header>

    <main class="contenedor">
        <section class="formulario">
            <h2>Crear una cuenta</h2>

            <form id="formularioRegistro">

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" required>

                <label for="correoRegistro">Correo electrónico</label>
                <input type="email" id="correoRegistro" required>

                <label for="passwordRegistro">Contraseña</label>
                <input type="password" id="passwordRegistro" minlength="6" required>

                <label for="confirmarPassword">Confirmar contraseña</label>
                <input type="password" id="confirmarPassword" minlength="6" required>

                <button type="submit" class="btn">
                    Registrarme
                </button>

            </form>

            <div id="mensajeRegistro" class="resultado"></div>

            <p style="margin-top: 20px;">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Gestor de Envíos © 2026</p>
    </footer>

    <script src="js/registro.js"></script>

</body>
</html>

<!DOCTYPE html>

<head>

</head>
<body>

    <header>
        <nav class="navbar">
            <h1>Gestor de Envíos</h1>

            <div class="menu">

    <main class="contenedor">

        <section class="seguimiento">
            <h2>Consulta tu envío</h2>

            <p>

                de tu paquete.
            </p>

            <div class="busqueda">
                <input
                    type="text"
                    id="numeroGuia"
                    placeholder="Ejemplo: ENV-123456"
                >

                <button onclick="buscarEnvio()" class="btn">
                    Buscar
                </button>
            </div>

            <div id="informacionEnvio"></div>

        </section>

    </main>

    <footer>
        <p>Gestor de Envíos © 2026</p>
    </footer>

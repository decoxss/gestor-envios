<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <script src="js/sesion.js"></script>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <h1>Gestor de Envíos</h1>
        </nav>
    </header>

    <main class="contenedor">
        <section class="formulario">
            <h2>Iniciar sesión</h2>

            <form id="formularioLogin">
                <label for="correoLogin">Correo electrónico</label>
                <input type="email" id="correoLogin" required>

                <label for="passwordLogin">Contraseña</label>
                <input type="password" id="passwordLogin" required>

                <button type="submit" class="btn">
                    Iniciar sesión
                </button>
            </form>

            <div id="mensajeLogin" class="resultado"></div>

            <p style="margin-top: 20px;">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Gestor de Envíos © 2026</p>
    </footer>

    <script src="js/login.js"></script>

</body>
</html>
